<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tom Yum Board</title>
  <script src="https://cdn.zingchart.com/zingchart.min.js"></script>
</head>

<body>
  <!--Nav-->
  <ul>
    <li id="performance-link" style="display:none"><a href="/api/performance">Performance</a></li>
    <li id="events-link" style="display:none"><a href="/api/events">Events</a></li>
    <li id="pageviews-link" style="display:none"><a href="/api/pageviews">Pageviews</a></li>
    <li id="admin-link" style="display:none"><a href="/api/admin">Admin</a></li>
  </ul>


  <!--Hero-->
  <h1 id="welcome-title"></h1>
  <h2>Tom Yum Khave</h2>
  <button id="logout-button">Logout</button>
  <script>
    //logout button script
    document.getElementById('logout-button').addEventListener('click', async () => {
      try {
        const response = await fetch('/api/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        if (data && data.success) {
          window.location.href = '/';
        } else {
          alert('Logout failed: ' + (data ? data.message : 'Unknown error'));
        }
      } catch (err) { console.error('Logout error:', err); }
    });
  </script>
  <script>
    document.write(`Live @ ${new Date()}`);
  </script>


  <!--Table + Charts-->
  <h2>Tom Yum Data</h2>
  <table id="performance-table">
    <thead>
      <tr>
        <th>URL</th>
        <th>Avg Load (ms)</th>
        <th>Avg TTFB (ms)</th>
        <th>Avg LCP (s)</th>
        <th>Avg CLS</th>
        <th>Samples</th>
      </tr>
    </thead>
    <tbody id="performance-tbody">
    </tbody>
  </table>
  <br></br>
  <div id="loadChart"></div>
  <div id="ttfbChart"></div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {


      //check role
      try {
        const response = await fetch('/api/check-sess')
        const data = await response.json() 
        if(data.user.role === 'admin' || data.user.role === 'owner'){
          document.getElementById('admin-link').style.display = 'block';
          document.getElementById('performance-link').style.display = 'block';
          document.getElementById('events-link').style.display = 'block';
          document.getElementById('pageviews-link').style.display = 'block';
        }
        if(data.user.role === 'analyst') {
          document.getElementById('performance-link').style.display = 'block';
          document.getElementById('events-link').style.display = 'block';
          document.getElementById('pageviews-link').style.display = 'block';
        }
        document.getElementById('welcome-title').textContent = `Welcome, ${data.user.username}`;
      } catch(err) { console.error(err); }
      

      // get dashboard data
      try {
          const response = await fetch("/api/performance_data", {
            method: "GET",
            headers: {"Content-Type": "application/json"}
          });
          const payload = await response.json();


          // set table data
          const home = payload.data[0];
          const btn = payload.data[1];
          const tbody = document.getElementById("performance-tbody");
          payload.data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${row.url}</td>
              <td>${row.avg_load_ms}</td>
              <td>${row.avg_ttfb_ms}</td>
              <td>${row.avg_lcp}</td>
              <td>${row.avg_cls}</td>
              <td>${row.samples}</td>
            `;
            tbody.appendChild(tr);
          });
          const sites = ['avg_load_ms', 'avg_ttfb_ms'];


          // render charts
          let loadConfig = {
                type: 'bar',
                title: {
                  text: 'Performance Data',
                  fontSize: 24,
                },
                legend: {
                  draggable: true,
                },
                scaleX: {
                  // Set scale label
                  label: { text: 'Sites' },
                  // Convert text on scale indices 
                  labels: [sites[0]]
                },
                scaleY: { 
                  // Scale label with unicode character 
                  label: { text: 'ms' } },
                  plot: { 
                    // Animation docs here: 
                    // https://www.zingchart.com/docs/tutorials/styling/animation#effect
                    animation: { 
                      effect: 'ANIMATION_EXPAND_BOTTOM',
                      method: 'ANIMATION_STRONG_EASE_OUT',
                      sequence: 'ANIMATION_BY_NODE',
                      speed: 275,
                    } 
                },
                series: [ 
                  {
                    // plot 1 values, linear data 
                    values: [home.avg_load_ms],
                    text: 'Home',
                  },
                  {
                    // plot 2 values, linear data
                    values: [btn.avg_load_ms],
                    text: 'Button'
                  }
                ]
              };
          zingchart.render({
            id: 'loadChart',
            data: loadConfig,
          });
          let ttfbConfig = {
            type: 'bar',
            title: {
              text: 'Performance Data',
              fontSize: 24,
            },
            legend: {
              draggable: true,
            },
            scaleX: {
              // Set scale label
              label: { text: 'Sites' },
              // Convert text on scale indices 
              labels: [sites[1]]
            },
            scaleY: { 
              // Scale label with unicode character 
              label: { text: 'ms' } },
              plot: { 
                // Animation docs here: 
                // https://www.zingchart.com/docs/tutorials/styling/animation#effect
                animation: { 
                  effect: 'ANIMATION_EXPAND_BOTTOM',
                  method: 'ANIMATION_STRONG_EASE_OUT',
                  sequence: 'ANIMATION_BY_NODE',
                  speed: 275,
                } 
            },
            series: [ 
              {
                // plot 1 values, linear data 
                values: [home.avg_ttfb_ms],
                text: 'Home',
              },
              {
                // plot 2 values, linear data
                values: [btn.avg_ttfb_ms],
                text: 'Button'
              }
            ]
          };
          zingchart.render({
            id: 'ttfbChart',
            data: ttfbConfig,
          });
      } catch (err) { console.error("Error fetching performance data:", err); }
    });
  </script>
</body>

</html>
