<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tom Yum Events</title>
        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    const response = await fetch('/api/check-sess'); 
                    const data = await response.json();
                    if(data.user.role === 'admin' || data.user.role === 'owner'){
                        document.getElementById('admin-link').style.display = 'block';
                    }
                } catch(err) {console.error(err)};
            });
        </script>
    </head>
    <body>
        <ul>
            <li><a href="/api/dashboard">Dashboard</a></li>
            <li><a href="/api/performance">Performance</a></li>
            <li><a href="/api/pageviews">Pageviews</a></li>
            <li id="admin-link" style="display:none"><a href="/api/admin">Admin</a></li>
        </ul>
    </body>
</html>
