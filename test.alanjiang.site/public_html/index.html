<!DOCTYPE html>
<html>
<head>
  <title>Alan Jiang Test Page</title>
  <!-- ANALYTICS SCRIPT GOES HERE -->
   <script src="https://www.collector.alanjiang.site/collector.js"></script>
   <link rel="stylesheet" type="text/css" href="./styles.css">
</head>
<body>

<h1>Alan Jiang Test Page</h1>
<p>This page contains various HTML forms for analytics testing.</p>

<hr>

<h2>Error</h2>
<button id="error-button" onClick="throw new Error('Test error');">Click</button>

<h2>Search Form</h2>
<form action="#" method="get">
  <p>
    <label for="query">Search query:</label><br>
    <input type="text" id="query" name="query">
    <input type="submit" value="Search">
  </p>
</form>

<hr>

<h2>Newsletter Signup</h2>
<form action="#" method="post">
  <p>
    <label for="signup-email">Email address:</label><br>
    <input type="email" id="signup-email" name="signup-email">
  </p>
  <p>
    <label>Interests:</label><br>
    <input type="checkbox" id="news" name="interests" value="news">
    <label for="news">News</label><br>
    <input type="checkbox" id="updates" name="interests" value="updates">
    <label for="updates">Product Updates</label><br>
    <input type="checkbox" id="offers" name="interests" value="offers">
    <label for="offers">Special Offers</label>
  </p>
  <p>
    <label>Frequency:</label><br>
    <input type="radio" id="daily" name="frequency" value="daily">
    <label for="daily">Daily</label><br>
    <input type="radio" id="weekly" name="frequency" value="weekly">
    <label for="weekly">Weekly</label><br>
    <input type="radio" id="monthly" name="frequency" value="monthly">
    <label for="monthly">Monthly</label>
  </p>
  <p>
    <input type="submit" value="Sign Up">
    <input type="reset" value="Clear">
  </p>
</form>

<hr>

<h2>Login Form</h2>
<form action="#" method="post">
  <p>
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username">
  </p>
  <p>
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password">
  </p>
  <p>
    <input type="checkbox" id="remember" name="remember" value="yes">
    <label for="remember">Remember me</label>
  </p>
  <p>
    <input type="submit" value="Log In">
  </p>
</form>

<hr>

<p><a href="buttons-page.html">Go to Button Page</a></p>

</body>
</html>
